name: docs

on:
  push:
    branches: [main]
    paths: ['docs/**', '.github/workflows/docs.yml', '.github/scripts/deploy-docs.py']
  pull_request:
    paths: ['docs/**', '.github/workflows/docs.yml', '.github/scripts/deploy-docs.py']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: docs

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - run: npm ci

      # Fails on dead links between pages.
      - run: npm run build

      # The built site, also kept as a zip for uploading by hand.
      - uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: docs/.vitepress/dist

  # Uploads the site to the documentation server after every change merged
  # into main. Runs only once the DOCS_FTP_SERVER variable is set; see the
  # FTP settings below.
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.DOCS_FTP_SERVER != ''
    needs: build
    runs-on: ubuntu-latest

    concurrency:
      group: docs-deploy
      cancel-in-progress: false

    steps:
      # Only the deploy script; the site comes from the build job.
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@v4
        with:
          name: docs-site
          path: site

      # Only changed files are uploaded, assets before the pages that load
      # them; files uploaded earlier and no longer in the site are deleted
      # last. The list of uploaded files on the server is saved as the
      # upload goes, so if the server drops the connection for too long
      # and this step fails, running the job again continues where it
      # stopped. See .github/scripts/deploy-docs.py.
      - name: Upload the site
        env:
          FTP_SERVER: ${{ vars.DOCS_FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.DOCS_FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.DOCS_FTP_PASSWORD }}
          FTP_PROTOCOL: ${{ vars.DOCS_FTP_PROTOCOL || 'ftps' }}
          FTP_PORT: ${{ vars.DOCS_FTP_PORT || 21 }}
          FTP_DIR: ${{ vars.DOCS_FTP_DIR || './' }}
        run: python3 .github/scripts/deploy-docs.py site
